<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bin Collection Days</title>
  <style>
    :root {
      --bg: #f5f6f4;
      --card: #ffffff;
      --text: #1d2321;
      --muted: #5f6b66;
      --line: #dfe3e0;
      --focus: #0b6e4f;
      --bin-gar: #d64545;  /* general: red lid */
      --bin-rec: #e9b908;  /* recycling: yellow lid */
      --bin-gen: #5aa832;  /* green waste */
      --bin-org: #8bc34a;  /* organics: lime lid */
      --bin-blk: #7a7f7c;  /* skip */
      --cal-title: #4fa8d8;
      --cal-navy: #1b3a57;
      --cal-border: #1b6fb0;
      --cal-card-top: #e2e2e2;
      --cal-card-bottom: #f6f6f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
    h1 { font-size: 1.75rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; }

    /* ── search ── */
    .search { position: relative; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="search"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }
    input[type="search"]:focus { outline: none; border-color: var(--focus); }
    .hint { font-size: .85rem; color: var(--muted); margin-top: 6px; }

    .suggestions {
      position: absolute; left: 0; right: 0; top: 100%;
      margin: 4px 0 0; padding: 4px; list-style: none;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      max-height: 320px; overflow-y: auto; z-index: 10;
    }
    .suggestions[hidden] { display: none; }
    .suggestions li { padding: 10px 12px; border-radius: 6px; cursor: pointer; }
    .suggestions li[aria-selected="true"], .suggestions li:hover { background: #e8f3ee; }
    .suggestions .empty { color: var(--muted); cursor: default; background: none !important; }

    .status { margin-top: 24px; color: var(--muted); }
    .status.error { color: #b42318; }

    /* ── calendar ── */
    .calendar { margin-top: 40px; }
    .calendar[hidden] { display: none; }
    .calendar-title { font-size: 2rem; color: var(--cal-title); margin: 0 0 16px; font-weight: 600; }
    .showing { font-size: 1.05rem; color: var(--cal-navy); margin: 0 0 28px; }
    .showing strong { margin-right: 6px; }
    .showing span { color: #667085; font-weight: 700; }

    .month + .month { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 24px; }
    .month-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: none; border: 2px solid transparent; border-radius: 4px; padding: 6px 4px;
      font: inherit; font-size: 1.4rem; font-weight: 700; color: var(--cal-navy);
      cursor: pointer; text-align: left;
    }
    .month-header:focus-visible { border-color: var(--cal-border); outline: none; }
    .month[data-expanded="true"] .month-header { border-bottom: 2px solid var(--cal-border); border-radius: 0; }
    .chevron {
      flex: none; width: 34px; height: 34px; border-radius: 50%; background: #eef1f4;
      display: flex; align-items: center; justify-content: center; transition: transform .15s ease;
    }
    .month[data-expanded="true"] .chevron { transform: rotate(180deg); }

    .month-body { padding-top: 20px; }
    .month[data-expanded="false"] .month-body { display: none; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--cal-card-bottom); border-radius: 6px; overflow: hidden; }
    .card-top { background: var(--cal-card-top); padding: 24px 16px; text-align: center; }
    .icon-circle {
      width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-circle svg { width: 30px; height: 30px; }
    .card-top h3 { margin: 0 0 4px; font-size: 1.05rem; color: var(--cal-navy); }
    .card-top .freq { margin: 0; color: #5a6672; font-size: .9rem; }
    .dates { list-style: none; margin: 0; padding: 16px; display: grid; gap: 12px; }
    .dates li { display: flex; align-items: center; gap: 10px; color: var(--cal-navy); }
    .dates li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #98a2b3; flex: none; }
    .dates .date-icon { flex: none; width: 18px; height: 18px; color: #667085; }

    @media (max-width: 420px) {
      .calendar-title { font-size: 1.5rem; }
      .month-header { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <!--
    Config:
      data-council = council slug (karratha, joondalup, ...)
      data-api     = API base URL ("" = same domain)
  -->
  <main class="wrap" id="collections" data-council="karratha" data-api="">
    <h1>Bin collection days</h1>
    <p class="lead">Find out when your bins are collected.</p>

    <div class="search">
      <label for="address">Your address</label>
      <input id="address" type="search" autocomplete="off" placeholder="e.g. 12 Sample Street"
             role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list" />
      <p class="hint">Type at least 3 characters, then choose your address from the list.</p>
      <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="calendar" id="calendar" hidden>
      <h2 class="calendar-title" id="calendar-title"></h2>
      <p class="showing"><strong>Showing results for</strong><span id="calendar-address"></span></p>
      <div id="months"></div>
    </section>
  </main>

  <script>
    (function () {
      const root = document.getElementById('collections');
      // allow ?council=joondalup in the URL for testing other councils
      const council = new URLSearchParams(location.search).get('council') || root.dataset.council;
      const api = root.dataset.api || '';

      const input = document.getElementById('address');
      const list = document.getElementById('suggestions');
      const status = document.getElementById('status');
      const calendar = document.getElementById('calendar');

      const COLORS = { GAR: '--bin-gar', REC: '--bin-rec', GEN: '--bin-gen', ORG: '--bin-org', BLK: '--bin-blk' };

      let items = [];
      let active = -1;
      let timer;
      let lastQuery = '';
      let controller;

      const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      function setStatus(text, isError) {
        status.textContent = text || '';
        status.classList.toggle('error', !!isError);
      }

      // ── auth ──
      // The widget authenticates as a service account; the server mints the token from
      // USER_NAME/PASSWORD env vars, so no credentials are ever sent to the browser.
      let tokenPromise;
      function getToken(fresh) {
        if (fresh) tokenPromise = null;
        if (!tokenPromise) {
          tokenPromise = fetch(`${api}/api/auth/widget-token`, { method: 'POST' })
            .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
            .then((data) => data.token);
        }
        return tokenPromise;
      }

      // Fetch with the widget token attached; retries once with a fresh token on 401.
      async function authedFetch(url, options, retried) {
        const token = await getToken(!!retried);
        const res = await fetch(url, { ...options, headers: { ...options?.headers, Authorization: `Bearer ${token}` } });
        if (res.status === 401 && !retried) return authedFetch(url, options, true);
        return res;
      }

      // ── autocomplete ──
      input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 3) return closeList();
        timer = setTimeout(() => search(q), 250);
      });

      async function search(q) {
        if (q === lastQuery) return;
        lastQuery = q;
        controller?.abort();
        controller = new AbortController();
        try {
          const res = await authedFetch(`${api}/api/addresses?council=${encodeURIComponent(council)}&q=${encodeURIComponent(q)}`, { signal: controller.signal });
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          items = data.addresses || [];
          renderList();
        } catch (e) {
          if (e.name !== 'AbortError') setStatus('Address search is unavailable right now. Please try again shortly.', true);
        }
      }

      function renderList() {
        active = -1;
        list.innerHTML = items.length
          ? items.map((a, i) => `<li role="option" id="opt-${i}" data-i="${i}" aria-selected="false">${escapeHtml(a.label)}</li>`).join('')
          : '<li class="empty">No matching addresses. Check the spelling or try just the street name.</li>';
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
      }

      function closeList() {
        list.hidden = true;
        list.innerHTML = '';
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        items = [];
        active = -1;
        lastQuery = '';
      }

      function highlight(i) {
        const opts = list.querySelectorAll('[role="option"]');
        opts.forEach((o) => o.setAttribute('aria-selected', 'false'));
        if (i >= 0 && opts[i]) {
          opts[i].setAttribute('aria-selected', 'true');
          opts[i].scrollIntoView({ block: 'nearest' });
          input.setAttribute('aria-activedescendant', opts[i].id);
        }
        active = i;
      }

      input.addEventListener('keydown', (e) => {
        if (list.hidden || !items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); highlight(Math.min(active + 1, items.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(Math.max(active - 1, 0)); }
        else if (e.key === 'Enter') { e.preventDefault(); choose(active >= 0 ? active : 0); }
        else if (e.key === 'Escape') { closeList(); }
      });

      list.addEventListener('mousedown', (e) => {
        const li = e.target.closest('[role="option"]');
        if (li) { e.preventDefault(); choose(Number(li.dataset.i)); }
      });

      input.addEventListener('blur', () => setTimeout(closeList, 150));

      function choose(i) {
        const a = items[i];
        if (!a) return;
        input.value = a.label;
        closeList();
        loadCollections(a.id);
        try { localStorage.setItem(`bins:${council}`, JSON.stringify(a)); } catch (_) {}
      }

      // ── collections ──
      async function loadCollections(addressId) {
        setStatus('Loading collection days…');
        calendar.hidden = true;
        try {
          const res = await authedFetch(`${api}/api/collections?addressId=${addressId}`);
          if (!res.ok) throw new Error(res.status);
          renderCalendar(await res.json());
          setStatus('');
        } catch (e) {
          setStatus('We couldn\u2019t load collection days for that address. Please try again.', true);
        }
      }

      // "2026-10-27" -> "Monday 27th" (date-only string, parsed as UTC so it never shifts)
      function dayLabel(iso) {
        const d = new Date(iso + 'T00:00:00Z');
        const weekday = d.toLocaleDateString('en-AU', { weekday: 'long', timeZone: 'UTC' });
        const day = d.getUTCDate();
        const suffix = day % 10 === 1 && day !== 11 ? 'st' : day % 10 === 2 && day !== 12 ? 'nd' : day % 10 === 3 && day !== 13 ? 'rd' : 'th';
        return `${weekday} ${day}${suffix}`;
      }

      function binIcon(type) {
        const fill = `var(${COLORS[type] || '--bin-gar'})`;
        return `<div class="icon-circle" style="background:${fill}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true">
            <path d="M6 7h12l-1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/>
            <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            <path d="M4 7h16"/>
          </svg>
        </div>`;
      }

      const dateIcon = `<svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>`;

      function monthHtml(m, expanded) {
        const cards = m.collections.length
          ? m.collections.map((c) => `
            <div class="card">
              <div class="card-top">
                ${binIcon(c.runType)}
                <h3>${escapeHtml(c.typeName)} Waste Collection</h3>
                <p class="freq">Collection ${escapeHtml(c.frequency)}</p>
              </div>
              <ul class="dates">
                ${c.dates.map((d) => `<li>${dateIcon}${dayLabel(d)}</li>`).join('')}
              </ul>
            </div>`).join('')
          : '<p class="status">No collections scheduled this month.</p>';

        return `<div class="month" data-expanded="${expanded}">
          <button type="button" class="month-header" aria-expanded="${expanded}">
            <span>${escapeHtml(m.label)}</span>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#344054" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </button>
          <div class="month-body">
            <div class="cards">${cards}</div>
          </div>
        </div>`;
      }

      function renderCalendar(data) {
        document.getElementById('calendar-title').textContent = `${data.months[0]?.year ?? ''} Collection Calendar`;
        document.getElementById('calendar-address').textContent = data.address.label;

        const months = document.getElementById('months');
        months.innerHTML = data.months.map((m, i) => monthHtml(m, i === 0)).join('');

        months.querySelectorAll('.month-header').forEach((btn) => {
          btn.addEventListener('click', () => {
            const month = btn.closest('.month');
            const expanded = month.dataset.expanded === 'true';
            month.dataset.expanded = String(!expanded);
            btn.setAttribute('aria-expanded', String(!expanded));
          });
        });

        calendar.hidden = false;
      }

      // remember the last address on this device
      try {
        const saved = JSON.parse(localStorage.getItem(`bins:${council}`) || 'null');
        if (saved) { input.value = saved.label; loadCollections(saved.id); }
      } catch (_) {}
    })();
  </script>
</body>
</html>
